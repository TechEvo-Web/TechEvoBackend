version: '3.8'
services:
  security_service:
    container_name: security
    image: postgres:alpine
    environment:
      POSTGRES_USER: SECURITY
      POSTGRES_PASSWORD: SECURITY
      POSTGRES_DB: User
    ports:
      - '5437:5432'
    volumes:
      - securityData:/var/lib/postgresql/data
    networks:
      - ecommerce-evo

  product_service:
    container_name: product
    image: postgres
    environment:
      POSTGRES_USER: ROOT
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: EvoProduct
    ports:
     - '5433:5432'
    volumes:
     - productDataEvo:/var/lib/postgresql/data
    networks:
      - ecommerce-evo

  blogpost_service:
    container_name: blogpost
    image: postgres
    environment:
      POSTGRES_USER: BLOGPOST
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: BlogPost
    ports:
      - '5436:5432'
    volumes:
      - blogpostData:/var/lib/postgresql/data
    networks:
      - ecommerce-evo

  order_service:
    container_name: order
    image: postgres:alpine
    environment:
      POSTGRES_USER: ORDER
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: Order
    ports:
      - '5434:5432'
    volumes:
      - orderData:/var/lib/postgresql/data
    networks:
      - ecommerce-evo

  admin_service:
    container_name: admin
    image: postgres
    environment:
      POSTGRES_USER: ADMIN
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: Admin
    ports:
      - '5435:5432'
    volumes:
      - adminData:/var/lib/postgresql/data
    networks:
     - ecommerce-evo

  redis:
    image: docker.io/bitnami/redis:7.2
    environment:
      - REDIS_PASSWORD=ecommerce-redis-p@ss
      - REDIS_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
    ports:
      - '6380:6379'
    volumes:
      - 'redis_data:/bitnami/redis/data'
    networks:
     - ecommerce-evo

volumes:
  securityData: {}
  redis_data: {}
  productDataEvo: {}
  blogpostData: {}
  orderData: {}
  adminData: {}

networks:
  ecommerce-evo:
   driver: bridge


